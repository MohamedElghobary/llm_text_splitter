[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-text-splitter"
version = "0.1.0"
authors = [
  { name="Mohamed Elghobary", email="m.abdeltawab.elghobary@gmail.com" },
]
description = "A lightweight, rule-based text splitter for LLM context window management."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
]
keywords = ["LLM", "text-processing", "text-splitter", "NLP", "AI", "document-processing", "context-window"]

[project.urls]
"Homepage" = "https://github.com/MohamedElghobary/llm_text_splitter"
"Bug Tracker" = "https://github.com/MohamedElghobary/llm_text_splitter/issues"
"Source Code" = "https://github.com/MohamedElghobary/llm_text_splitter"

[tool.setuptools]
packages = ["llm_text_splitter"]
